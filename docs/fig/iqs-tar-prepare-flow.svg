<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 250" width="794" height="250" role="img" aria-labelledby="t d">
  <title id="t">Prepare a .tar archive when the platform cannot download the image</title>
  <desc id="d">On a host PC with internet access, download the Docker image as a .tar with skopeo. Copy it to the platform by USB drive, place it in binaries/docker-images, then run iqs-launcher with the same tag.</desc>
  <style>
    :root { --card:#FFFFFF; --stroke:#94A3B8; --text:#0F172A; --muted:#475569; --line:#475569; --lane:#F1F5F9; --lane-stroke:#CBD5E1;
            --accent:#2563EB; --accent-bg:#DBEAFE; --ok:#15803D; --ok-bg:#DCFCE7; }
    @media (prefers-color-scheme: dark) {
      :root { --card:#1E293B; --stroke:#64748B; --text:#F1F5F9; --muted:#CBD5E1; --line:#94A3B8; --lane:#0F172A; --lane-stroke:#334155;
              --accent:#60A5FA; --accent-bg:#1E3A5F; --ok:#86EFAC; --ok-bg:#14532D; }
    }
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); }
    .lane { fill: var(--lane); stroke: var(--lane-stroke); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .lane-label { font-size: 12px; font-weight: 600; fill: var(--muted); letter-spacing: .02em; }
    .card { fill: var(--card); stroke: var(--stroke); stroke-width: 1.5; }
    .final { fill: var(--ok-bg); stroke: var(--ok); stroke-width: 1.5; }
    .title { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: var(--accent); }
    .badge { fill: var(--accent); }
    .badge-text { fill: #FFFFFF; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .arrow { stroke: var(--line); stroke-width: 1.8; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/>
    </marker>
  </defs>

  <!-- Lanes -->
  <rect class="lane" x="8" y="14" width="190" height="222" rx="14"/>
  <text class="lane-label" x="22" y="36">HOST PC · INTERNET</text>
  <rect class="lane" x="400" y="14" width="386" height="222" rx="14"/>
  <text class="lane-label" x="414" y="36">PLATFORM · NO NETWORK NEEDED</text>

  <!-- 1 Download -->
  <rect class="card" x="18" y="60" width="170" height="156" rx="10"/>
  <circle class="badge" cx="40" cy="84" r="12"/>
  <text class="badge-text" x="40" y="88">1</text>
  <text class="title" x="60" y="89">Download</text>
  <text class="sub" x="32" y="118">Save the Docker image</text>
  <text class="sub" x="32" y="136">as a .tar archive.</text>
  <text class="mono" x="32" y="172">skopeo copy</text>
  <text class="mono" x="32" y="190">→ &lt;app&gt;.tar</text>

  <!-- 2 Transfer -->
  <rect class="card" x="214" y="60" width="170" height="156" rx="10"/>
  <circle class="badge" cx="236" cy="84" r="12"/>
  <text class="badge-text" x="236" y="88">2</text>
  <text class="title" x="256" y="89">Transfer</text>
  <text class="sub" x="228" y="118">Copy it to a USB drive,</text>
  <text class="sub" x="228" y="136">then mount the drive.</text>
  <text class="mono" x="228" y="172">lsblk</text>
  <text class="mono" x="228" y="190">mount</text>

  <!-- 3 Place -->
  <rect class="card" x="410" y="60" width="170" height="156" rx="10"/>
  <circle class="badge" cx="432" cy="84" r="12"/>
  <text class="badge-text" x="432" y="88">3</text>
  <text class="title" x="452" y="89">Place</text>
  <text class="sub" x="424" y="118">Copy the archive into</text>
  <text class="sub" x="424" y="136">binaries/docker-images/</text>
  <text class="mono" x="424" y="172">cp &lt;app&gt;.tar</text>
  <text class="mono" x="424" y="190">binaries/docker-images/</text>

  <!-- 4 Launch -->
  <rect class="final" x="606" y="60" width="170" height="156" rx="10"/>
  <circle class="badge" cx="628" cy="84" r="12"/>
  <text class="badge-text" x="628" y="88">4</text>
  <text class="title" x="648" y="89">Launch</text>
  <text class="sub" x="620" y="118">Use the same tag as</text>
  <text class="sub" x="620" y="136">the archive you saved.</text>
  <text class="mono" x="620" y="172">iqs-launcher --autotag</text>
  <text class="mono" x="620" y="190">&lt;app&gt;:&lt;version&gt;</text>

  <!-- Arrows -->
  <path class="arrow" d="M188 138 H212"/>
  <path class="arrow" d="M384 138 H408"/>
  <path class="arrow" d="M580 138 H604"/>
</svg>
